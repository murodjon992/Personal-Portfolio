services:
  db:
    image: postgres:16-alpine
    container_name: portfolio-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile   # <--- Dockerfile qayerdaligini ko'rsatamiz
    container_name: portfolio-backend-1
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8002:8000"
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile   # <--- Frontend uchun ham
    container_name: portfolio-frontend-1
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  db_data: