name: Deploy Portfolio to VPS

on:
  push:
    branches: [ main ] # yoki master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.VPS_HOST }}       # VPS IP manzilingiz
        username: ${{ secrets.VPS_USERNAME }} # masalan: root
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
          cd ~/portfolio
          git pull origin main
          docker compose down
          docker compose up -d --build
          docker exec portfolio-backend-1 python manage.py migrate
          docker exec portfolio-backend-1 python manage.py collectstatic --noinput